spring:
  application:
    name: service
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
app:
  cors:
    allowed-origins:
      - ${URL_LOCAL}
      - ${URL_PROD}
  rate-limit:
    capacity: 20
    tokens-per-minute: 60
astra:
  endpoint: ${ASTRA_DB_EP}
  token: ${ASTRA_DB_TOKEN}
  keyspace: ${ASTRA_DB_KEYSPACE}
  tbn:
    projects: ${TBN_PROJECTS}
    book: ${TBN_BOOKS}
    details: ${TBN_USER_DETAILS}

cloudinary:
    cloud-name: ${CLOUDINARY_NAME}
    key: ${CLOUDINARY_KEY}
    secret: ${CLOUDINARY_SECRET}

logging:
  level:
    com:
      datastax:
        astra:
          internal:
            command:
              AbstractCommandRunner: ERROR