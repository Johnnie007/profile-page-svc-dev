name: DB Activation Maintenance

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-table-row:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing table row
        env:
          ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_EP }}
          ASTRA_DB_KEYSPACE: ${{ secrets.ASTRA_DB_KEYSPACE }}
          ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
        run: |
          : "${ASTRA_DB_API_ENDPOINT:?Set the Astra Data API base endpoint in repository secrets}"
          : "${ASTRA_DB_KEYSPACE:?Set ASTRA_DB_KEYSPACE in repository secrets}"
          : "${ASTRA_DB_TOKEN:?Set ASTRA_DB_TOKEN in repository secrets}"

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          if http_status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "${ASTRA_DB_API_ENDPOINT%/}/api/json/v1/${ASTRA_DB_KEYSPACE}/maintenance" \
            -H "Token: ${ASTRA_DB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw '{"findOne":{"filter":{"id":"d290f1ee-6c54-4b01-90e6-d701748f0851"}}}'); then
            curl_status=0
          else
            curl_status=$?
          fi

          echo "Astra Data API HTTP status: ${http_status:-000}"
          if [ -s "$response_file" ] && jq -e '(.errors // []) | length > 0' "$response_file" >/dev/null 2>&1; then
            jq -r '.errors[]?.message // empty | "Astra Data API error: \(.)"' "$response_file"
            exit 1
          fi

          if [ "$curl_status" -ne 0 ]; then
            echo "curl failed with exit code ${curl_status}; response body was not logged."
            exit "$curl_status"
          fi

          echo "Table read completed."
