name: DB Activation Maintenance

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  count-users:
    runs-on: ubuntu-latest
    steps:
      - name: Count users
        env:
          ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_EP }}
          ASTRA_DB_KEYSPACE: ${{ secrets.ASTRA_DB_KEYSPACE }}
          ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
        run: |
          : "${ASTRA_DB_API_ENDPOINT:?Set the Astra Data API base endpoint in repository secrets}"
          : "${ASTRA_DB_KEYSPACE:?Set ASTRA_DB_KEYSPACE in repository secrets}"
          : "${ASTRA_DB_TOKEN:?Set ASTRA_DB_TOKEN in repository secrets}"

          response=$(curl --fail-with-body --silent --show-error \
            "${ASTRA_DB_API_ENDPOINT%/}/api/json/v1/${ASTRA_DB_KEYSPACE}/maintenance" \
            -H "Token: ${ASTRA_DB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw '{"countDocuments":{"filter":{"id":"d290f1ee-6c54-4b01-90e6-d701748f0851"}}}')

          echo "$response" | jq -er '.status.count | "User count: \(.)"'
