name: DB Activation Maintenance

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-table-row:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing table row
        env:
          ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_EP }}
          ASTRA_DB_KEYSPACE: ${{ secrets.ASTRA_DB_KEYSPACE }}
          ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
        run: |
          : "${ASTRA_DB_API_ENDPOINT:?Set the Astra Data API base endpoint in repository secrets}"
          : "${ASTRA_DB_KEYSPACE:?Set ASTRA_DB_KEYSPACE in repository secrets}"
          : "${ASTRA_DB_TOKEN:?Set ASTRA_DB_TOKEN in repository secrets}"

          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ["ASTRA_DB_API_ENDPOINT"]
          parsed = urlsplit(endpoint)
          checks = {
              "HTTPS scheme": parsed.scheme == "https",
              "hostname present": bool(parsed.hostname),
              "base URL has no path/query/fragment": not (
                  parsed.path or parsed.query or parsed.fragment
              ),
              "endpoint has no whitespace": not any(c.isspace() for c in endpoint),
              "keyspace is one path segment": (
                  bool(os.environ["ASTRA_DB_KEYSPACE"])
                  and "/" not in os.environ["ASTRA_DB_KEYSPACE"]
                  and not any(c.isspace() for c in os.environ["ASTRA_DB_KEYSPACE"])
              ),
          }
          for label, passed in checks.items():
              print(f"{label}: {'ok' if passed else 'FAILED'}")
          if not all(checks.values()):
              raise SystemExit("Invalid Astra endpoint/keyspace format.")
          PY

          set -o pipefail
          curl --fail-with-body --silent --show-error \
            "${ASTRA_DB_API_ENDPOINT%/}/api/json/v1/${ASTRA_DB_KEYSPACE}/maintenance" \
            -H "Token: ${ASTRA_DB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw '{"findOne":{"filter":{"id":"290f1ee-6c54-4b01-90e6-d701748f0851"}}}' \
            | jq -er '
            if ((.errors // []) | length) > 0 then
              error(.errors[0].message)
            else
              "Table read completed."
            end
          '
